# /home/user/saas/config/nginx/dev.conf

user user;
worker_processes auto;

error_log /home/user/saas/config/nginx/logs/global.error.log warn;
pid /tmp/nginx_saas_dev.pid;

events {
    worker_connections 768;
}

http {
    upstream nextjs_dev_server {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        listen [::]:8080;
        server_name saas.dev.local *.saas.dev.local localhost;
        access_log /home/user/saas/config/nginx/logs/saas.dev.local.http.access.log;

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        server_name saas.dev.local *.saas.dev.local localhost;
        access_log /home/user/saas/config/nginx/logs/saas.dev.local.https.access.log;

        ssl_certificate         /home/user/saas/config/certs/saas.dev.local.pem;
        ssl_certificate_key     /home/user/saas/config/certs/saas.dev.local-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        location / {
            proxy_pass http://nextjs_dev_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}